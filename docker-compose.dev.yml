services:
  app-dev:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./docs:/app/docs
      - ./README.md:/app/README.md
      - ./.env:/app/.env
    command: ["sleep", "infinity"]
