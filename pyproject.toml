[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofepris-brsdm-scraper"
version = "0.1.0"
description = "Pipeline to scrape COFEPRIS BRSDM, normalize XLSX, and load PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4",
  "filelock>=3.15.4",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "playwright>=1.53.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.3.4",
  "sqlalchemy>=2.0.31",
  "structlog>=24.2.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "pre-commit>=3.8.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "pytest-playwright>=0.5.1",
  "ruff>=0.5.5",
  "testcontainers[postgresql]>=4.8.1",
]

[project.scripts]
cofepris = "cofepris_brsdm_scraper.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=cofepris_brsdm_scraper --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas", "apscheduler.*"]
ignore_missing_imports = true
